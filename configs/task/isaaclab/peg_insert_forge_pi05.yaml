# FORGE (Isaac Lab) / pi05_droid_jointpos zero-shot eval — tactile-phase, first server test.
#
# Read by TWO different processes:
#   - forge_server.py (in .venv-isaaclab)      reads: task_name, realtime_throttle,
#                                                       server_host, server_port
#   - IsaacLabEnvWrapper / eval scripts (.venv) reads: env_wrapper, server_host,
#                                                       server_port, language_instruction

env_wrapper: "isaaclab"

# -- Server side ---------------------------------------------------------
task_name: "Isaac-Forge-PegInsert-Direct-v0"

# Wall-clock pacing of env.step() on the server. False = run as fast as the
# GPU allows. This does NOT affect what pi05_droid_jointpos sees or does:
# FORGE's simulated seconds per env step (1/15s, via decimation=8 @ 120Hz
# physics) already matches the checkpoint's 15Hz pretraining assumption
# regardless of this flag — see design-decisions summary. Kept as a flag
# for later visual debugging / real-deployment latency testing, not
# because it's needed for policy correctness now.
realtime_throttle: false

# -- Shared ----------------------------------------------------------------
server_host: "localhost"   # override to the env-server node's hostname once
                             # client and server run as separate SLURM jobs
                             # (topology not yet decided — see summary)
server_port: 8102

# -- Client side (eval_policy.py / train_pi_robo.py) -----------------------
language_instruction: "Insert the peg into the socket."
droid_checkpoint: "pi05_droid_jointpos"   # public PI checkpoint, NOT this project's
                                     # own ManiSkill LoRA SFT — see summary
